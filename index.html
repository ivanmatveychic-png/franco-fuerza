<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Fuerza · Franco</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fuerza">
<meta name="theme-color" content="#0F131C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F131C;
    --panel:#171C28;
    --panel-2:#1E2431;
    --line:#2B3340;
    --line-soft:#232A36;
    --ink:#ECEEF2;
    --ink-mid:#98A2B2;
    --ink-dim:#657084;
    --effort:#FF9F45;
    --measure:#35C6E8;
    --good:#55CE86;
    --warn:#FF6B5A;
    --radius:14px;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    background:radial-gradient(1000px 500px at 20% -10%, #182031 0%, transparent 55%), var(--bg);
    color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.5;
    padding:calc(16px + var(--safe-t)) 14px calc(28px + var(--safe-b));
  }
  .wrap{max-width:560px;margin:0 auto}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* ---------- header ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .id .eyebrow{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
  .id h1{font-family:var(--disp);font-weight:700;font-size:23px;margin:2px 0 0;letter-spacing:-.01em}
  .id h1 span{color:var(--effort)}
  .tools{display:flex;gap:7px}
  .tbtn{font-family:var(--body);font-size:12px;font-weight:600;color:var(--ink-mid);background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;min-height:40px}
  .tbtn:active{background:var(--panel-2)}
  .tbtn.ok{color:var(--good);border-color:var(--good)}

  /* ---------- blocks + exercise rows ---------- */
  .block{margin-bottom:18px}
  .block-label{display:flex;align-items:baseline;gap:8px;margin:0 2px 9px;
    font-family:var(--disp);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--effort)}
  .block-label i{font-family:var(--body);font-style:normal;font-weight:500;font-size:11px;text-transform:none;letter-spacing:0;color:var(--ink-dim)}

  .ex{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);font-family:var(--body);
    background:var(--panel);border:1px solid var(--line);border-radius:13px;
    padding:13px 14px;margin-bottom:8px;cursor:pointer;min-height:64px;transition:background .12s}
  .ex:active{background:var(--panel-2)}
  .ex .main{flex:1;min-width:0}
  .ex .nm{font-weight:600;font-size:15px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .ex .meta{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:2px}
  .ex .spark{width:66px;height:34px;flex:none}
  .ex .rt{text-align:right;flex:none;min-width:56px}
  .ex .rt .w{font-family:var(--mono);font-weight:700;font-size:19px;line-height:1}
  .ex .rt .w u{font-size:10px;color:var(--ink-dim);text-decoration:none;font-weight:500}
  .ex .rt .tr{font-family:var(--mono);font-size:10.5px;margin-top:3px}
  .tr.up{color:var(--good)}.tr.down{color:var(--warn)}.tr.flat{color:var(--ink-dim)}
  .ex .chev{color:var(--ink-dim);font-size:18px;flex:none;margin-left:-4px}

  /* ---------- detail overlay ---------- */
  .detail{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;
    transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
    padding:calc(10px + var(--safe-t)) 0 calc(30px + var(--safe-b));}
  .detail.on{transform:translateX(0)}
  .detail-in{max-width:560px;margin:0 auto;padding:0 14px}
  .dhead{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;
    background:linear-gradient(var(--bg) 70%, transparent);padding:6px 0 12px}
  .back{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--ink);
    width:42px;height:42px;font-size:20px;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
  .back:active{background:var(--panel-2)}
  .dtitle{min-width:0;flex:1}
  .ren{background:transparent;border:0;color:var(--ink-dim);opacity:.35;font-size:15px;width:36px;height:36px;flex:none;cursor:pointer;border-radius:9px}
  .ren:active{opacity:1;background:var(--panel)}
  .ren-in{font-family:var(--disp);font-weight:700;font-size:17px;padding:8px 10px;min-height:40px}
  .dtitle .nm{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em}
  .dtitle .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);margin-top:1px}

  /* stat row */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 10px;text-align:center}
  .stat .k{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
  .stat .v{font-family:var(--mono);font-weight:700;font-size:20px;margin-top:3px;color:var(--effort)}
  .stat .v small{font-size:11px;color:var(--ink-dim);font-weight:500}
  .stat.m .v{color:var(--measure)}

  /* chart card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
  .card h3{font-family:var(--disp);font-size:12.5px;font-weight:600;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .card h3 .dot{width:7px;height:7px;border-radius:50%;background:var(--effort)}
  .seg{display:flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:12px;gap:2px}
  .seg button{flex:1;font-family:var(--body);font-size:12px;font-weight:600;color:var(--ink-mid);
    background:transparent;border:0;border-radius:8px;padding:8px 4px;cursor:pointer;min-height:38px}
  .seg button[aria-pressed="true"]{background:var(--effort);color:#231502}
  .chart{width:100%;height:180px;display:block;overflow:visible}
  .chart-empty{height:180px;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);
    font-family:var(--mono);font-size:12px;text-align:center;padding:0 20px}

  /* history */
  .sess{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 12px;margin-bottom:8px}
  .sess .sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .sess .dt{font-family:var(--mono);font-size:12px;color:var(--ink-mid);font-weight:700}
  .sess .top{font-family:var(--mono);font-size:11px;color:var(--effort);font-weight:700}
  .sess .sets{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-family:var(--mono);font-size:12px;background:#12151b;border:1px solid var(--line);
    border-radius:7px;padding:4px 8px;color:var(--ink)}
  .sess .acts{display:flex;gap:14px;margin-top:9px}
  .sess .acts button{background:transparent;border:0;color:var(--ink-dim);font-size:12px;cursor:pointer;
    font-family:var(--body);padding:4px 0;min-height:32px}
  .sess .acts button:active{color:var(--ink)}
  .sess .acts .del:active{color:var(--warn)}

  .btn{font-family:var(--body);font-weight:600;cursor:pointer;border-radius:11px;padding:13px;
    font-size:14px;min-height:48px;width:100%;border:1px solid var(--line);background:var(--panel-2);color:var(--ink)}
  .btn:active{background:var(--line-soft)}
  .btn.pri{background:var(--effort);color:#231502;border-color:var(--effort)}
  .btn.ghost{background:transparent}

  /* session editor */
  .editor{background:var(--panel);border:1px solid var(--effort);border-radius:14px;padding:14px;margin-bottom:14px}
  .editor h4{font-family:var(--disp);font-size:13px;margin:0 0 12px;font-weight:600}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-dim);font-weight:600;margin-bottom:6px}
  input{font-family:var(--mono);font-size:16px;background:#12151b;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:12px;width:100%;min-height:48px}
  input:focus{outline:2px solid var(--effort);outline-offset:0;border-color:transparent}
  .setrow{display:grid;grid-template-columns:26px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
  .setrow .n{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-align:center}
  .setrow .x{background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:9px;
    height:48px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .setrow .x:active{border-color:var(--warn);color:var(--warn)}
  .ed-foot{display:flex;gap:8px;margin-top:6px}
  .ed-foot .btn{flex:1}

  /* modal (respaldo) */
  .scrim{position:fixed;inset:0;background:rgba(8,10,14,.75);backdrop-filter:blur(3px);display:none;
    align-items:flex-end;justify-content:center;z-index:60}
  .scrim.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;
    padding:18px 16px calc(20px + var(--safe-b));max-height:88vh;overflow:auto}
  .modal h3{font-family:var(--disp);font-size:17px;margin:0 0 4px}
  .modal .msub{font-size:12.5px;color:var(--ink-dim);margin-bottom:14px;line-height:1.5}
  .backup-area{width:100%;min-height:110px;max-height:34vh;font-family:var(--mono);font-size:11px;
    background:#12151b;border:1px solid var(--line);color:var(--ink-mid);border-radius:10px;padding:10px;white-space:pre;overflow:auto}
  .modal-foot{display:flex;gap:8px;margin-top:12px}
  .modal-foot .btn{flex:1}
  .x-close{background:transparent;border:0;color:var(--ink-dim);font-size:24px;cursor:pointer;float:right;line-height:1}

  .save-toast{position:fixed;left:50%;bottom:calc(18px + var(--safe-b));transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:10px 16px;font-size:12.5px;
    font-weight:600;color:var(--ink);z-index:70;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center;
    box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .save-toast.ok{border-color:var(--good);color:var(--good)}
  .save-toast.err{border-color:var(--warn);color:var(--warn);pointer-events:auto}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}

  /* editor de semanas */
  .wk-block{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:12px;margin-bottom:10px}
  .wk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .wk-name{font-family:var(--disp);font-weight:600;font-size:13.5px;color:var(--measure)}
  .wk-del{background:transparent;border:0;color:var(--ink-dim);font-size:12px;cursor:pointer;font-family:var(--body);min-height:34px;padding:0 2px}
  .wk-del:active{color:var(--warn)}
  .ed-set,.ed-cols{display:grid;grid-template-columns:20px 1fr 14px 1fr 46px;gap:7px;align-items:center;margin-bottom:8px}
  .ed-set .sn{font-family:var(--mono);font-size:12px;color:var(--ink-dim);text-align:center}
  .ed-cols{margin-bottom:5px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
  .ed-cols span{text-align:center}
  .ed-set .mul{text-align:center;color:var(--ink-dim);font-family:var(--mono);font-size:13px}
  .ed-set .reps,.ed-set .wt{width:100%}
  .ed-set .x{background:transparent;border:1px solid var(--line);color:var(--ink-dim);border-radius:10px;height:48px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .ed-set .x:active{border-color:var(--warn);color:var(--warn)}
  .wk-addset{margin-top:2px}
</style>
</head>
<body>
<div class="wrap" id="app"><div style="color:var(--ink-dim);font-family:var(--mono);font-size:13px;padding:40px 0;text-align:center">Cargando…</div></div>

<div class="detail" id="detail" aria-hidden="true"><div class="detail-in" id="detailIn"></div></div>

<!-- backup modal -->
<div class="scrim" id="bscrim" role="dialog" aria-modal="true">
  <div class="modal">
    <button class="x-close" onclick="closeB()" aria-label="Cerrar">×</button>
    <h3 class="disp">Respaldo</h3>
    <div class="msub">Guardá tu progreso: descargá el archivo o copiá el texto. Si algo se borra, lo importás y recuperás todo.</div>
    <textarea class="backup-area" id="backupText" readonly onclick="this.select()"></textarea>
    <div class="modal-foot">
      <button class="btn pri" onclick="downloadBackup()">⤓ Descargar</button>
      <button class="btn" onclick="copyBackup()">Copiar</button>
    </div>
    <div class="modal-foot"><button class="btn ghost" onclick="toggleImport()">Importar respaldo…</button></div>
    <div id="importBox" style="display:none;margin-top:6px">
      <div class="msub" style="margin-top:8px"><span style="color:var(--warn)">Reemplaza todos los datos actuales.</span></div>
      <textarea class="backup-area" id="importText" placeholder="Pegá acá el texto del respaldo…"></textarea>
      <div class="modal-foot"><button class="btn pri" onclick="doImport()">Importar y reemplazar</button></div>
    </div>
  </div>
</div>

<div id="saveToast" class="save-toast" role="status" aria-live="polite"></div>

<script>
const KEY = "fitsys:franco:rutina3d:v1";

/* ---------- seed: rutina de Franco (3 días), limpia ---------- */
function seed(){
  const L=(label,block)=>({label,block,unit:"kg",weeks:[]});
  return {
    profile:{ name:"Franco" },
    lifts:{
      d1_press_plano:L("Press plano mancuerna","Día 1"),
      d1_press_inclinado:L("Press inclinado","Día 1"),
      d1_apertura:L("Apertura","Día 1"),
      d1_biceps_polea:L("Bíceps polea","Día 1"),
      d1_martillo:L("Martillo","Día 1"),
      d2_jalon_pecho:L("Jalón al pecho","Día 2"),
      d2_remo_maquina:L("Remo máquina","Día 2"),
      d2_remo_abierto:L("Remo abierto","Día 2"),
      d2_jalon_unilateral:L("Jalón unilateral supino","Día 2"),
      d2_press_frances:L("Press francés","Día 2"),
      d2_ext_triceps:L("Extensión de tríceps","Día 2"),
      d3_sentadilla:L("Sentadilla","Día 3"),
      d3_prensa:L("Prensa","Día 3"),
      d3_femorales:L("Femorales","Día 3"),
      d3_camilla:L("Camilla cuádriceps","Día 3"),
      d3_press_militar:L("Press militar","Día 3")
    }
  };
}

/* ---------- almacenamiento (nube → localStorage) ---------- */
let S=null;
function todayISO(){ return new Date().toISOString().slice(0,10); }
async function storageSet(k,v){
  if(window.storage&&window.storage.set){ try{ const r=await window.storage.set(k,v); if(r) return 'cloud'; }catch(e){} }
  try{ localStorage.setItem(k,v); return 'local'; }catch(e){}
  return false;
}
async function storageGet(k){
  if(window.storage&&window.storage.get){ try{ const r=await window.storage.get(k); if(r) return r.value; }catch(e){} }
  try{ const v=localStorage.getItem(k); if(v!=null) return v; }catch(e){}
  return null;
}
async function load(){
  let loaded=false;
  try{ const raw=await storageGet(KEY); if(raw){ S=JSON.parse(raw); loaded=true; } else { S=seed(); } }
  catch(e){ S=seed(); }
  // migración simple: asegurar que existan los ejercicios base y el campo weeks
  const base=seed();
  if(!S.lifts) S.lifts=base.lifts;
  Object.keys(S.lifts).forEach(k=>{ if(!Array.isArray(S.lifts[k].weeks)) S.lifts[k].weeks=[]; });
  if(!loaded) await save();
}
let _saving=false,_pending=false;
async function save(){
  if(_saving){ _pending=true; return; }
  _saving=true; let mode=false;
  for(let i=0;i<3&&!mode;i++){ mode=await storageSet(KEY,JSON.stringify(S)); if(!mode) await new Promise(r=>setTimeout(r,300*(i+1))); }
  _saving=false; saveStatus(mode);
  if(_pending){ _pending=false; save(); }
  return mode;
}
function saveStatus(mode){
  const t=document.getElementById('saveToast'); if(!t) return; clearTimeout(t._h);
  if(mode==='cloud'){ t.textContent='Guardado ✓'; t.className='save-toast ok show'; t._h=setTimeout(()=>t.classList.remove('show'),1000); }
  else if(mode==='local'){ t.textContent='Guardado ✓'; t.className='save-toast ok show'; t._h=setTimeout(()=>t.classList.remove('show'),900); }
  else { t.textContent='⚠ No se pudo guardar. Abrí Respaldo y descargá tus datos.'; t.className='save-toast err show'; }
}
function toast(msg,ok){ const t=document.getElementById('saveToast'); if(!t)return; clearTimeout(t._h);
  t.textContent=msg; t.className='save-toast '+(ok?'ok':'err')+' show'; if(ok) t._h=setTimeout(()=>t.classList.remove('show'),1300); }

/* ---------- métricas (por semana) ---------- */
function validSets(week){ return (week||[]).filter(x=>x&&!isNaN(x.weight)&&!isNaN(x.reps)); }
function wTop(week){ const v=validSets(week); return v.length?Math.max(...v.map(x=>x.weight)):null; }
function wBest(week){ const v=validSets(week); if(!v.length)return null; return v.reduce((a,b)=> b.weight>a.weight||(b.weight===a.weight&&b.reps>a.reps)?b:a); }
function w1RM(week){ const v=validSets(week); if(!v.length)return null; return Math.max(...v.map(x=>x.weight*(1+x.reps/30))); }
function wVol(week){ return validSets(week).reduce((t,x)=>t+x.reps*x.weight,0); }
function lastFilled(weeks){ for(let i=weeks.length-1;i>=0;i--){ if(wTop(weeks[i])!=null) return i; } return -1; }
function firstFilled(weeks){ for(let i=0;i<weeks.length;i++){ if(wTop(weeks[i])!=null) return i; } return -1; }

/* ---------- helpers ---------- */
function h(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstChild; }
function esc(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- render principal ---------- */
function render(){
  const app=document.getElementById('app');
  const order=['Día 1','Día 2','Día 3'];
  const groups={};
  Object.keys(S.lifts).forEach(k=>{ const b=S.lifts[k].block||'Otros'; (groups[b]=groups[b]||[]).push(k); });
  const blocks=order.filter(b=>groups[b]).concat(Object.keys(groups).filter(b=>!order.includes(b)));
  app.innerHTML = `
    <div class="top">
      <div class="id">
        <div class="eyebrow">Sobrecarga progresiva</div>
        <h1 class="disp">${esc(S.profile.name)} · <span>Fuerza</span></h1>
      </div>
      <div class="tools">
        <button class="tbtn" id="syncBtn" onclick="syncNow()">↻</button>
        <button class="tbtn" onclick="openB()">⤓ Respaldo</button>
      </div>
    </div>
    ${blocks.map(b=>`
      <div class="block">
        <div class="block-label"><span>${b}</span><i>${groups[b].length} ejercicios</i></div>
        ${groups[b].map(exRow).join('')}
      </div>`).join('')}
  `;
}

function exRow(key){
  const L=S.lifts[key];
  const li=lastFilled(L.weeks);
  const top=li>=0?wTop(L.weeks[li]):null;
  const series=L.weeks.map(wTop).filter(v=>v!=null);
  let tr='', trTxt='';
  if(series.length>=2){
    const d=series[series.length-1]-series[0];
    const cls=d>0?'up':d<0?'down':'flat';
    tr=cls; trTxt=(cls==='up'?'▲ ':cls==='down'?'▼ ':'')+(d>0?'+':'')+(+d.toFixed(1))+'kg';
  } else if(series.length===1){ tr='flat'; trTxt='1ª semana'; }
  else { tr='flat'; trTxt='—'; }
  return `
  <button class="ex" onclick="openLift('${key}')">
    <div class="main">
      <div class="nm">${esc(L.label)}</div>
      <div class="meta">${L.target?'obj '+L.target+' · ':''}${L.weeks.length} ${L.weeks.length===1?'semana':'semanas'}</div>
    </div>
    ${sparkline(series)}
    <div class="rt">
      <div class="w">${top!=null?(+top.toFixed(1)):'—'}<u>${top!=null?'kg':''}</u></div>
      <div class="tr ${tr}">${trTxt}</div>
    </div>
    <div class="chev">›</div>
  </button>`;
}

function sparkline(series){
  const W=66,H=34;
  if(series.length<2) return `<svg class="spark" viewBox="0 0 ${W} ${H}"><line x1="2" y1="${H-5}" x2="${W-2}" y2="${H-5}" stroke="#2B3340" stroke-width="1.5"/></svg>`;
  const min=Math.min(...series), max=Math.max(...series), span=(max-min)||1, n=series.length-1;
  const X=i=>2+i*(W-4)/n, Y=v=>H-4-(v-min)/span*(H-9);
  const pts=series.map((v,i)=>[X(i),Y(v)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const rising=series[series.length-1]>=series[0];
  const col=rising?'#FF9F45':'#FF6B5A';
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.4" fill="${col}"/></svg>`;
}

/* ---------- detalle por ejercicio ---------- */
let curKey=null, curMetric='peso', draft=null;
function openLift(key){
  curKey=key; curMetric='peso'; loadDraft(); renderDetail();
  const d=document.getElementById('detail'); d.classList.add('on'); d.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden'; window.scrollTo(0,0);
}
function closeLift(){ const d=document.getElementById('detail'); d.classList.remove('on'); d.setAttribute('aria-hidden','true');
  document.body.style.overflow=''; curKey=null; draft=null; }

function loadDraft(){
  const wks=S.lifts[curKey].weeks||[];
  draft = wks.length
    ? wks.map(w=>(w&&w.length?w.map(s=>({reps:String(s.reps),weight:String(s.weight)})):[{reps:'',weight:''}]))
    : [[{reps:'',weight:''},{reps:'',weight:''},{reps:'',weight:''}]];
}
function weeksFromDraft(){
  return draft.map(w=> w.map(s=>({reps:parseFloat(s.reps),weight:parseFloat(s.weight)})).filter(s=>!isNaN(s.reps)&&!isNaN(s.weight)));
}
async function persist(){ S.lifts[curKey].weeks = weeksFromDraft(); return save(); }

function renderDetail(){
  const L=S.lifts[curKey];
  const weeks=L.weeks;
  const li=lastFilled(weeks);
  const top=li>=0?wTop(weeks[li]):null;
  const best=li>=0?wBest(weeks[li]):null;
  const orm=li>=0?w1RM(weeks[li]):null;
  const box=document.getElementById('detailIn');
  box.innerHTML = `
    <div class="dhead">
      <button class="back" onclick="closeLift()" aria-label="Volver">‹</button>
      <div class="dtitle"><div class="nm" id="dName">${esc(L.label)}</div><div class="sub">${L.block}${L.target?' · objetivo '+L.target:''}</div></div>
      <button class="ren" onclick="startRename()" aria-label="Editar nombre">✎</button>
    </div>
    <div class="card">
      <h3><span class="dot"></span>Gráfico de avance</h3>
      <div class="seg" role="group">
        <button aria-pressed="${curMetric==='peso'}" onclick="setMetric('peso')">Peso máx</button>
        <button aria-pressed="${curMetric==='1rm'}" onclick="setMetric('1rm')">1RM est.</button>
        <button aria-pressed="${curMetric==='vol'}" onclick="setMetric('vol')">Volumen</button>
      </div>
      ${progressChart(weeks)}
    </div>
    <div class="card">
      <h3><span class="dot"></span>Series por semana <span style="margin-left:auto;font-family:var(--body);font-weight:500;color:var(--ink-dim);font-size:11px">se guarda solo</span></h3>
      <div id="weeksBox"></div>
      <button class="btn pri" style="margin-top:4px" onclick="addWeek()">+ Agregar semana</button>
    </div>
  `;
  renderWeeks();
}
function startRename(){
  const box=document.getElementById('dName'); if(!box||box.querySelector('input')) return;
  const L=S.lifts[curKey];
  box.innerHTML='';
  const inp=document.createElement('input'); inp.className='ren-in'; inp.value=L.label; inp.setAttribute('enterkeyhint','done');
  box.appendChild(inp); inp.focus(); inp.select();
  let done=false;
  const commit=async()=>{ if(done)return; done=true; const v=inp.value.trim(); if(v&&v!==L.label){ L.label=v; await save(); render(); } renderDetail(); };
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); } if(e.key==='Escape'){ done=true; renderDetail(); } });
  inp.addEventListener('blur',commit);
}
function setMetric(m){ curMetric=m; renderDetail(); }
function metricVal(week){ return curMetric==='peso'?wTop(week):curMetric==='1rm'?w1RM(week):wVol(week); }
function metricLabel(){ return curMetric==='peso'?'kg · peso máx por semana':curMetric==='1rm'?'kg · 1RM estimado':'kg·reps · volumen'; }

function progressChart(weeks){
  const pts=weeks.map((w,i)=>({i, v:metricVal(w)})).filter(p=>p.v!=null);
  const W=520,H=180,padL=34,padR=12,padT=14,padB=26;
  if(pts.length<2) return `<div class="chart-empty">${pts.length===0?'Cargá tus series para ver el progreso.':'Con 2+ semanas aparece la curva de avance.'}</div>`;
  const vals=pts.map(p=>p.v);
  let min=Math.min(...vals),max=Math.max(...vals);
  if(min===max){ min=min*0.95; max=max*1.05||1; }
  const pd=(max-min)*0.12; min-=pd; max+=pd;
  const n=pts.length-1;
  const X=i=>padL+i*(W-padL-padR)/n, Y=v=>(H-padB)-(v-min)/(max-min)*(H-padT-padB);
  const P=pts.map((p,i)=>[X(i),Y(p.v)]);
  const line=P.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${P[0][0].toFixed(1)} ${H-padB} `+P.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${P[n][0].toFixed(1)} ${H-padB} Z`;
  const dots=P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="#FF9F45"/>`).join('');
  const yLabels=`<text x="${padL-5}" y="${(Y(max)+3).toFixed(1)}" fill="#657084" font-size="10" text-anchor="end" font-family="monospace">${(+max.toFixed(0))}</text><text x="${padL-5}" y="${(Y(min)+3).toFixed(1)}" fill="#657084" font-size="10" text-anchor="end" font-family="monospace">${(+min.toFixed(0))}</text>`;
  const step=Math.max(1,Math.ceil(pts.length/5));
  let xLabels='';
  for(let k=0;k<pts.length;k+=step){ xLabels+=`<text x="${X(k).toFixed(1)}" y="${H-8}" fill="#657084" font-size="9.5" text-anchor="middle" font-family="monospace">S${pts[k].i+1}</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF9F45" stop-opacity=".22"/><stop offset="1" stop-color="#FF9F45" stop-opacity="0"/></linearGradient></defs>
    <line x1="${padL}" y1="${H-padB}" x2="${W-padR}" y2="${H-padB}" stroke="#2B3340" stroke-width="1"/>
    <path d="${area}" fill="url(#g)"/>
    <path d="${line}" fill="none" stroke="#FF9F45" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${yLabels}${xLabels}
  </svg>
  <div style="text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-dim);margin-top:6px">${metricLabel()}</div>`;
}

/* ---- editor de semanas (estilo tu app original) ---- */
function renderWeeks(){
  const box=document.getElementById('weeksBox'); box.innerHTML='';
  draft.forEach((week,wi)=> box.appendChild(weekBlock(week,wi)));
}
function weekBlock(week,wi){
  const el=h(`<div class="wk-block">
    <div class="wk-head"><span class="wk-name">Semana ${wi+1}</span><button class="wk-del">Borrar semana</button></div>
    <div class="ed-cols"><span>#</span><span>Reps</span><span></span><span>Kg</span><span></span></div>
    <div class="wk-sets"></div>
    <button class="btn ghost wk-addset">+ Serie</button>
  </div>`);
  const setsBox=el.querySelector('.wk-sets');
  week.forEach((st,si)=> setsBox.appendChild(edSet(wi,si,st)));
  el.querySelector('.wk-del').addEventListener('click',()=>{ draft.splice(wi,1); if(!draft.length) draft.push([{reps:'',weight:''}]); persist(); renderDetail(); });
  el.querySelector('.wk-addset').addEventListener('click',()=>{ draft[wi].push({reps:'',weight:''}); renderWeeks(); persist(); });
  return el;
}
function edSet(wi,si,st){
  const el=h(`<div class="ed-set">
    <span class="sn">${si+1}</span>
    <input inputmode="numeric" class="reps" placeholder="reps" value="${st.reps??''}">
    <span class="mul">×</span>
    <input inputmode="decimal" class="wt" placeholder="kg" value="${st.weight??''}">
    <button class="x" aria-label="Quitar serie">×</button>
  </div>`);
  const rp=el.querySelector('.reps'), wt=el.querySelector('.wt');
  rp.addEventListener('input',e=>{ draft[wi][si].reps=e.target.value; });
  wt.addEventListener('input',e=>{ draft[wi][si].weight=e.target.value; });
  rp.addEventListener('change',()=>persist());
  wt.addEventListener('change',()=>persist());
  el.querySelector('.x').addEventListener('click',()=>{ draft[wi].splice(si,1); if(!draft[wi].length) draft[wi].push({reps:'',weight:''}); renderWeeks(); persist(); });
  return el;
}
function addWeek(){
  // la semana nueva arranca con las series de la anterior: solo ajustás lo que subiste
  let prev=null;
  for(let i=draft.length-1;i>=0;i--){ const f=draft[i].filter(x=>x.reps!==''&&x.weight!==''); if(f.length){ prev=f; break; } }
  draft.push(prev ? prev.map(x=>({reps:x.reps,weight:x.weight})) : [{reps:'',weight:''},{reps:'',weight:''},{reps:'',weight:''}]);
  persist(); renderDetail();
  const blocks=document.querySelectorAll('.wk-block'); const last=blocks[blocks.length-1];
  if(last) last.scrollIntoView({behavior:'smooth',block:'start'});
}


/* ---------- sync + respaldo ---------- */
async function syncNow(){
  const b=document.getElementById('syncBtn'); if(b){ b.textContent='…'; }
  await load(); render();
  const nb=document.getElementById('syncBtn'); if(nb){ nb.textContent='✓'; nb.classList.add('ok'); setTimeout(()=>{ const x=document.getElementById('syncBtn'); if(x){ x.textContent='↻'; x.classList.remove('ok'); } },1200); }
}
function openB(){ document.getElementById('backupText').value=JSON.stringify(S); document.getElementById('importBox').style.display='none'; document.getElementById('importText').value=''; document.getElementById('bscrim').classList.add('on'); }
function closeB(){ document.getElementById('bscrim').classList.remove('on'); }
function toggleImport(){ const b=document.getElementById('importBox'); b.style.display=b.style.display==='none'?'block':'none'; }
async function copyBackup(){ const ta=document.getElementById('backupText'); ta.select(); try{ await navigator.clipboard.writeText(ta.value); toast('Copiado ✓',true); }catch(e){ try{ document.execCommand('copy'); toast('Copiado ✓',true); }catch(_){ toast('Seleccioná y copiá a mano',false); } } }
function downloadBackup(){ try{ const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='franco-fuerza-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('Respaldo descargado ✓',true); }catch(e){ toast('No se pudo descargar — usá Copiar',false); } }
async function doImport(){ const raw=document.getElementById('importText').value.trim(); if(!raw)return; let o; try{ o=JSON.parse(raw); }catch(e){ toast('Respaldo inválido',false); return; } if(!o||!o.lifts){ toast('Respaldo incompleto',false); return; } S=o; Object.keys(S.lifts).forEach(k=>{ if(!Array.isArray(S.lifts[k].weeks)) S.lifts[k].weeks=[]; }); const ok=await save(); closeB(); render(); toast(ok?'Datos importados ✓':'Importado, revisá guardado',ok); }

/* dismiss */
document.getElementById('bscrim').addEventListener('click',e=>{ if(e.target.id==='bscrim') closeB(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeB(); if(document.getElementById('detail').classList.contains('on')) closeLift(); } });

/* PWA */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }

/* boot */
(async ()=>{ await load(); render(); })();
</script>
